<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light dark}body{margin:0}</style></head><body>
<title>Argentique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Bowlby+One&family=VT323&display=swap" rel="stylesheet">
<style>
/* Concept: un atelier neutre (table lumineuse) où seul l'appareil choisi porte de la couleur.
   Le boîtier horizontal occupe la scène : viseur à gauche, déclencheur et réglages à droite. */
:root{
  --bg:#e3e6e9; --panel:#f3f4f5; --ink:#15181b; --ink-2:#5a636a; --line:#c8ced3; --tile:#d5dade;
  --cam-accent:#ffc400;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --logo:"Bowlby One",Impact,"Arial Black",sans-serif;
  --osd:"VT323",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16181b;--panel:#212428;--ink:#eef0f2;--ink-2:#98a1a8;--line:#33383d;--tile:#2a2e33;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#16181b;--panel:#212428;--ink:#eef0f2;--ink-2:#98a1a8;--line:#33383d;--tile:#2a2e33;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font:15px/1.4 var(--ui);
  padding-block:12px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.app{max-width:980px;margin:0 auto;display:grid;gap:14px}

/* En-tête */
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:9px;margin-right:auto}
.top h1 svg{width:24px;height:24px}
.tabs{display:flex;background:var(--tile);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tabs .n{font:500 11px var(--mono);background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--tile);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="false"]{color:var(--ink-2);opacity:.7}
:focus-visible{outline:3px solid var(--cam-accent);outline-offset:2px}

/* Sélecteur d'appareils */
.picker{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.tile{flex:1 0 76px;max-width:140px;display:grid;justify-items:center;gap:5px;padding:10px 4px 8px;border-radius:14px;border:1.5px solid transparent;background:transparent;color:var(--ink-2);font:600 11.5px/1.15 var(--ui);cursor:pointer;text-align:center}
.tile svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile svg .ac{fill:var(--tc);stroke:none}
.tile[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--tc);box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
.tile small{font:500 10px var(--mono);color:var(--ink-2);letter-spacing:.02em}

/* Boîtier */
.cam{
  --r:18px;--ar:1.5;--body:#ddd;--bodyc:#ddd;--cin:#111;--shut:#e33;--vfb:#111;--vfr:10px;
  position:relative;display:grid;gap:12px;padding:14px;border-radius:var(--r);background:var(--body);color:var(--cin);
  grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "vf" "ctl";
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.2),0 24px 40px -22px rgba(0,0,0,.55);
}
@media (min-width:680px){
  .cam{grid-template-columns:minmax(0,1fr) 200px;grid-template-areas:"top top" "vf ctl";padding:18px;gap:14px 18px}
}
.cam.swap{animation:swap .32s ease-out}
@keyframes swap{from{opacity:.2;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

.cam-top{grid-area:top;display:flex;align-items:center;gap:12px;min-width:0}
.flashwin{width:42px;height:17px;border-radius:5px;flex:none;background:linear-gradient(#f8fafb,#c3ccd3);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);transition:box-shadow .2s,background .2s}
.flashwin.on{background:linear-gradient(#fff,#fff7cf);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),0 0 16px 4px rgba(255,248,200,.9)}
.flashwin.off{opacity:.45}
.brand{font:700 15px var(--ui);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.spec{margin-left:auto;font:500 10.5px var(--mono);opacity:.75;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.counter{flex:none;display:flex;align-items:baseline;gap:6px;background:#0c0d0e;color:#f2b24a;padding:4px 9px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.15)}
.counter b{font:500 16px var(--mono);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.counter small{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.8}

.vf{grid-area:vf;position:relative;aspect-ratio:var(--ar);max-width:100%;background:#000;border-radius:var(--vfr);overflow:hidden;outline:4px solid var(--vfb);outline-offset:0;min-width:0}
.vf canvas{display:block;width:100%;height:100%}
.brackets{position:absolute;inset:10% 9%;pointer-events:none;opacity:.8;filter:drop-shadow(0 0 2px rgba(0,0,0,.6));
  background:
   linear-gradient(#fff,#fff) 0 0/18px 2px,linear-gradient(#fff,#fff) 0 0/2px 18px,
   linear-gradient(#fff,#fff) 100% 0/18px 2px,linear-gradient(#fff,#fff) 100% 0/2px 18px,
   linear-gradient(#fff,#fff) 0 100%/18px 2px,linear-gradient(#fff,#fff) 0 100%/2px 18px,
   linear-gradient(#fff,#fff) 100% 100%/18px 2px,linear-gradient(#fff,#fff) 100% 100%/2px 18px;
  background-repeat:no-repeat}
.vftag{position:absolute;left:8px;bottom:8px;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:5px;display:flex;gap:6px;align-items:center}
.vftag i{width:6px;height:6px;border-radius:50%;background:#7a8087}
.vftag.live i{background:#2fd16b}

.cam-ctl{grid-area:ctl;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;min-width:0;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:0;background:transparent;cursor:pointer;font:600 12.5px var(--ui);color:var(--cin);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 42%,transparent)}
.chip svg{width:15px;height:15px;fill:currentColor;flex:none}
.chip[aria-pressed="true"]{background:var(--cin);color:var(--bodyc);box-shadow:none}
.expo{display:flex;align-items:center;gap:8px;font:600 11px var(--ui);width:100%}
.expo input{flex:1;min-width:70px;accent-color:var(--cin)}
.shutter{flex:none;order:2;width:76px;height:76px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;background:var(--shut);
  box-shadow:0 5px 0 rgba(0,0,0,.3),inset 0 3px 5px rgba(255,255,255,.4),0 0 0 5px rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s}
.shutter span{position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.shutter:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3),inset 0 3px 5px rgba(255,255,255,.4),0 0 0 5px rgba(0,0,0,.14)}
.shutter[disabled]{opacity:.55}
@media (min-width:680px){
  .cam-ctl{flex-direction:column;align-items:stretch;justify-content:space-between;gap:16px}
  .shutter{order:0;align-self:center;width:92px;height:92px}
  .shutter span{inset:17px}
  .chips{flex:none;align-content:flex-end}
}

/* Les six boîtiers */
.cam[data-cam="jetable"]{--r:16px;--ar:1.5;--cin:#241b05;--bodyc:#ffcf1f;--shut:#e5331f;--vfb:#241b05;
  --body:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px),linear-gradient(180deg,#ffd93d,#f2b800)}
.cam[data-cam="jetable"] .brand{font:400 24px var(--logo);letter-spacing:.02em;color:#d3231a;text-shadow:2px 2px 0 #241b05;text-transform:none}
.cam[data-cam="jetable"] .cam-top{padding-bottom:10px;border-bottom:3px solid #241b05}

.cam[data-cam="instant"]{--r:22px;--ar:1.6;--cin:#2a2a29;--bodyc:#ecebe6;--shut:#e5382c;--vfb:#1b1b1a;--vfr:6px;
  --body:linear-gradient(180deg,#faf9f5,#dcdad2);padding-top:26px}
.cam[data-cam="instant"]::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,#f3b21a 0 25%,#ef5a2b 25% 50%,#b53a8f 50% 75%,#2f73c9 75%)}
.cam[data-cam="instant"] .brand{letter-spacing:.34em;font-size:12.5px}
.cam[data-cam="instant"] .vf{outline-width:7px}

.cam[data-cam="compact"]{--r:14px;--ar:1.5;--cin:#14171a;--bodyc:#b4b9bd;--shut:#2b2f35;--vfb:#101214;--vfr:8px;
  --body:linear-gradient(180deg,#dcdfe2 0%,#a3a9af 48%,#c3c7cb 100%)}
.cam[data-cam="compact"] .brand{text-shadow:0 1px 0 rgba(255,255,255,.65);letter-spacing:.26em}
.cam[data-cam="compact"] .shutter{box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 3px 5px rgba(255,255,255,.3),0 0 0 5px rgba(255,255,255,.3)}

.cam[data-cam="camcorder"]{--r:10px;--ar:1.3333;--cin:#e9ecee;--bodyc:#30343a;--shut:#e0302f;--vfb:#0c0d0f;--vfr:4px;
  --body:linear-gradient(180deg,#4d525a,#2b2f34)}
.cam[data-cam="camcorder"] .brand{font-weight:700;letter-spacing:.16em;display:flex;align-items:center;gap:8px}
.cam[data-cam="camcorder"] .brand::before{content:"";width:9px;height:9px;border-radius:50%;background:#e0302f;box-shadow:0 0 8px #e0302f}
.cam[data-cam="camcorder"] .chip[aria-pressed="true"]{background:#e9ecee;color:#2b2f34}

.cam[data-cam="digicam"]{--r:16px;--ar:1.3333;--cin:#0f1520;--bodyc:#a9b5c9;--shut:#2f62d6;--vfb:#0f1520;--vfr:6px;
  --body:linear-gradient(135deg,#d0d7e2 0%,#93a0b6 60%,#b9c3d4 100%)}
.cam[data-cam="digicam"] .brand{font-style:italic;letter-spacing:.12em}
.cam[data-cam="digicam"] .spec{color:#1e3f8f;opacity:1;font-weight:500}

.cam[data-cam="toy"]{--r:8px;--ar:1.3333;--cin:#fff1ee;--bodyc:#c7342a;--shut:#161619;--vfb:#2a0f0c;--vfr:3px;
  --body:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px),linear-gradient(180deg,#e2473b,#b3281f)}
.cam[data-cam="toy"] .brand{font-weight:700;font-style:italic;letter-spacing:.08em;font-size:17px}
.cam[data-cam="toy"] .chip[aria-pressed="true"]{background:#fff1ee;color:#b3281f}
.cam[data-cam="toy"] .shutter span{border-color:rgba(255,255,255,.3)}

.cam[data-cam="camcorder"] .brackets{display:none}
.note{margin:0;font-size:12.5px;color:var(--ink-2);text-align:center;max-width:60ch;margin-inline:auto;text-wrap:balance}

/* Galerie */
.gal{display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:0;padding:0;background:var(--panel);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;display:grid;box-shadow:0 1px 0 var(--line)}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--tile);display:block}
.thumb figcaption,.thumb .cap{display:flex;justify-content:space-between;gap:6px;padding:7px 9px;font:500 11px var(--mono);color:var(--ink-2)}
.empty{background:var(--panel);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty p{margin:0;max-width:40ch;color:var(--ink-2)}

/* Fenêtre résultat */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,10,12,.74);backdrop-filter:blur(6px);
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.card{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:20px;padding:14px;display:grid;gap:12px;animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.photo{position:relative;border-radius:6px;overflow:hidden;line-height:0;background:var(--tile);justify-self:center;max-width:100%}
.photo img{display:block;max-width:100%;max-height:min(62vh,640px);width:auto;height:auto;box-shadow:0 14px 30px -14px rgba(0,0,0,.55)}
.devmask{position:absolute;background:radial-gradient(circle at 50% 40%,#b9c4bd,#8f9d99 70%,#7c8b8f);animation:dev 7s ease-out forwards}
@keyframes dev{0%{opacity:1;backdrop-filter:blur(16px)}55%{opacity:.55}100%{opacity:0;backdrop-filter:blur(0)}}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{border:0;border-radius:999px;padding:10px 16px;font:600 14px var(--ui);cursor:pointer;background:var(--tile);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{color:#c4301f}
.btn[disabled]{opacity:.6;cursor:default}

#fx{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}
#fx.go{animation:fx .22s ease-out}
@keyframes fx{0%{opacity:.9}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:999px;font:600 13px var(--ui);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.vid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <h1>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2 17 11M22 12l-9 5M12 22 7 13M2 12l9-5M17 20.2 12 12M7 3.8 12 12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      Argentique
    </h1>
    <nav class="tabs" aria-label="Sections">
      <button id="tabCam" aria-selected="true">Appareils</button>
      <button id="tabGal" aria-selected="false">Galerie <span class="n" id="galCount">0</span></button>
    </nav>
    <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Son du déclencheur" title="Son du déclencheur">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 8v4h3l4 3.5v-11L6 8H3z"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section id="viewCam" class="gal">
    <div class="picker" id="picker" role="tablist" aria-label="Choisir un appareil"></div>
    <div class="cam" id="cam" data-cam="jetable">
      <div class="cam-top">
        <div class="flashwin" id="flashwin"></div>
        <div class="brand" id="brand"></div>
        <div class="spec" id="spec"></div>
        <div class="counter" title="Compteur"><b id="counter">27</b><small id="counterLbl">poses</small></div>
      </div>
      <div class="vf">
        <canvas id="view" width="480" height="320" aria-label="Viseur"></canvas>
        <div class="brackets"></div>
        <div class="vftag" id="vftag"><i></i><span id="vftxt">Aperçu</span></div>
      </div>
      <div class="cam-ctl">
        <div class="chips" id="chips"></div>
        <button class="shutter" id="shutter" aria-label="Prendre la photo"><span></span></button>
      </div>
    </div>
    <p class="note" id="note"></p>
  </section>

  <section id="viewGal" class="gal" hidden>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p>Ta galerie est vide. Prends une photo, puis touche « Garder » pour la ranger ici.</p>
      <button class="btn primary" id="goCam">Choisir un appareil</button>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden></div>
<div id="fx"></div>
<div id="toast" role="status" aria-live="polite"></div>
<video id="vid" class="vid" playsinline muted autoplay></video>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const safe=(fn,fb)=>{try{return fn()}catch(e){return fb}};
const ls={get:k=>safe(()=>localStorage.getItem(k),null),set:(k,v)=>safe(()=>localStorage.setItem(k,v))};
const pad=n=>String(n).padStart(2,'0');

/* ---------- Icônes ---------- */
const ICON={
 jetable:'<svg viewBox="0 0 48 48"><rect x="5" y="13" width="38" height="24" rx="4"/><circle cx="24" cy="26" r="7"/><circle class="ac" cx="24" cy="26" r="2.8"/><rect x="9" y="16.5" width="8" height="4.5" rx="1"/><rect x="34" y="16.5" width="5" height="4.5" rx="1"/><path d="M11 33h5M32 33h5"/></svg>',
 instant:'<svg viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="26" rx="4"/><path d="M6 20h36"/><circle cx="24" cy="30" r="7.5"/><circle class="ac" cx="24" cy="30" r="3"/><rect x="10" y="8.5" width="11" height="5.5" rx="1.5"/><circle class="ac" cx="36" cy="26" r="1.8"/></svg>',
 compact:'<svg viewBox="0 0 48 48"><rect x="4" y="16" width="40" height="19" rx="3.5"/><circle cx="17" cy="25.5" r="6.5"/><circle class="ac" cx="17" cy="25.5" r="2.5"/><rect x="28" y="19.5" width="6" height="4" rx="1"/><rect x="36" y="19.5" width="4" height="4" rx="1"/><path d="M28 30h12"/></svg>',
 camcorder:'<svg viewBox="0 0 48 48"><rect x="6" y="15" width="27" height="20" rx="3.5"/><path d="M33 19h5l4 3v7l-4 3h-5"/><circle class="ac" cx="39" cy="25.5" r="2"/><rect x="10" y="9.5" width="11" height="5.5" rx="1.5"/><circle class="ac" cx="12" cy="21" r="1.7"/><path d="M11 35v4h13v-4"/></svg>',
 digicam:'<svg viewBox="0 0 48 48"><rect x="5" y="13" width="38" height="23" rx="4"/><circle cx="29" cy="24.5" r="7.5"/><circle class="ac" cx="29" cy="24.5" r="3"/><rect x="9" y="16.5" width="8" height="4" rx="1"/><circle cx="12.5" cy="27" r="1.4"/><path d="M9 32h8M34 13v-2.5h5V13"/></svg>',
 toy:'<svg viewBox="0 0 48 48"><rect x="11" y="16" width="26" height="26" rx="2.5"/><circle cx="24" cy="31" r="8"/><circle class="ac" cx="24" cy="31" r="3.2"/><rect x="17" y="8.5" width="14" height="7.5" rx="1.5"/><path d="M37 22h3.5M7.5 22H11"/></svg>'
};
const CI={
 bolt:'<svg viewBox="0 0 20 20"><path d="M11 2 4 11h5l-1 7 8-10h-5z"/></svg>',

const tmpC=()=>document.createElement('canvas');
const anaC=tmpC();anaC.width=32;anaC.height=24;
const anaX=anaC.getContext('2d',{willReadFrequently:true});

let noiseTile=null;

      if(ch==="'"){ctx.fillRect(x+t*.3,0,t*.9,h*.22);x+=t*2.2;continue}
      const s=SEG[ch]||'';

/* Rendu complet d'une photo (ou d'un aperçu) */
function develop(out,src,sw,sh,key,o,mode){

    const px=paperTile.getContext('2d'),pd=px.createImageData(96,96),r=rng(4242);
    for(let i=0;i<pd.data.length;i+=4){const v=r()*255;pd.data[i]=pd.data[i+1]=pd.data[i+2]=v;pd.data[i+3]=26}
    px.putImageData(pd,0,0);

function jpegRound(canvas,q){

    canvas.toBlob(bl=>{
      if(!bl)return res(canvas);
      const u=URL.createObjectURL(bl),im=new Image();
      im.onload=()=>{const x=canvas.getContext('2d');x.drawImage(im,0,0);URL.revokeObjectURL(u);res(canvas)};
      im.onerror=()=>{URL.revokeObjectURL(u);res(canvas)};

  x.fillStyle=sg;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,196,176,.4)';
  for(let i=0;i<4;i++){
    const cx=((i*.31+t/70000)%1.3-.15)*w,cy=h*(.14+i*.075);
    x.beginPath();x.ellipse(cx,cy,w*.14,h*.024,0,0,7);x.fill();
    x.beginPath();x.ellipse(cx+w*.06,cy-h*.01,w*.08,h*.02,0,0,7);x.fill();
  }
  const hill=(col,base,amp,f,ph)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=8)x.lineTo(i,base+Math.sin(i*f+ph)*amp);x.lineTo(w,h);x.fill()};
  hill('#6a4a78',h*.62,h*.035,.011,1);
  hill('#3b2a58',h*.7,h*.04,.008,3);
  x.fillStyle='#1b1634';
  for(let i=0;i<14;i++){const bw=w*.045,bx=w*.05+i*w*.062,bh=h*(.1+((i*37)%11)/55);x.fillRect(bx,h*.78-bh,bw,bh+h*.3)}
  x.fillStyle='#ffd27a';
  for(let i=0;i<14;i++){const bx=w*.05+i*w*.062,bh=h*(.1+((i*37)%11)/55);
    for(let k=0;k<4;k++)if((i*5+k*3)%4!==0)x.fillRect(bx+w*.008+(k%2)*w*.02,h*.78-bh+h*.02+Math.floor(k/2)*h*.035,w*.011,h*.016)}
  hill('#120f26',h*.86,h*.02,.02,2);
  x.fillStyle='#0c0a1c';x.fillRect(w*.2,h*.5,w*.008,h*.5);x.fillRect(w*.2,h*.5,w*.05,h*.008);
  const lg=x.createRadialGradient(w*.25,h*.51,0,w*.25,h*.51,h*.15);
  lg.addColorStop(0,'rgba(255,240,190,1)');lg.addColorStop(.15,'rgba(255,214,130,.8)');lg.addColorStop(1,'rgba(255,190,100,0)');
  x.fillStyle=lg;x.fillRect(0,0,w,h);
}

/* ---------- État ---------- */
const state={cur:ORDER.includes(ls.get('argentique.cam'))?ls.get('argentique.cam'):'jetable',view:'cam',sheet:false,busy:false,live:false,facing:'environment',sound:ls.get('argentique.sound')!=='0',previewSeed:1,session:Date.now()};
const opts={};ORDER.forEach(k=>opts[k]=Object.assign({},CAMS[k].opt));
const roll={};ORDER.forEach(k=>{const v=parseInt(ls.get('argentique.roll.'+k),10);roll[k]=Number.isFinite(v)?clamp(v,0,CAMS[k].roll):CAMS[k].roll});
const vid=$('#vid'),view=$('#view'),vctx=view.getContext('2d',{willReadFrequently:true});
let stream=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}

/* ---------- Sélecteur et boîtier ---------- */
function buildPicker(){
  const p=$('#picker');p.innerHTML='';
  ORDER.forEach(k=>{
    const c=CAMS[k],b=document.createElement('button');
    b.className='tile';b.setAttribute('role','tab');b.dataset.k=k;b.style.setProperty('--tc',c.accent);
    b.innerHTML=ICON[k]+`<span>${c.name}</span>`;
    b.addEventListener('click',()=>selectCam(k,true));
    p.appendChild(b);
  });
}
function renderChips(){
  const k=state.cur,c=CAMS[k],o=opts[k],box=$('#chips');box.innerHTML='';
  const toggle=(key,label,icon)=>{
    const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',o[key]?'true':'false');
    b.innerHTML=CI[icon]+label;
    b.addEventListener('click',()=>{o[key]=!o[key];b.setAttribute('aria-pressed',o[key]?'true':'false');syncFlash()});
    box.appendChild(b);
  };
  c.ctl.forEach(t=>{
    if(t==='flash')toggle('flash','Flash','bolt');
    else if(t==='date')toggle('date','Date','date');
    else if(t==='night')toggle('night','Vision nuit','moon');
    else if(t==='leak')toggle('leak','Fuite de lumière','leak');
    else if(t==='expo'){
      const l=document.createElement('label');l.className='expo';
      l.innerHTML=`<span>Foncé</span><input type="range" id="expo" min="-2" max="2" step="0.5" value="${o.expo}" aria-label="Exposition"><span>Clair</span>`;
      l.querySelector('input').addEventListener('input',e=>{o.expo=parseFloat(e.target.value)});
      box.appendChild(l);
    }else if(t==='imp'){
      const b=document.createElement('button');b.className='chip';b.innerHTML=CI.imp+'Importer';
      b.addEventListener('click',()=>$('#fileLib').click());box.appendChild(b);
    }else if(t==='flip'&&state.live){
      const b=document.createElement('button');b.className='chip';b.innerHTML=CI.flip+'Retourner';
      b.addEventListener('click',()=>{state.facing=state.facing==='environment'?'user':'environment';startCam()});box.appendChild(b);
    }
  });
  if(c.roll&&roll[k]<=0){
    const b=document.createElement('button');b.className='chip';b.innerHTML=CI.reload+'Nouvelle pellicule';
    b.addEventListener('click',()=>{roll[k]=c.roll;ls.set('argentique.roll.'+k,roll[k]);renderCounter();renderChips()});
    box.appendChild(b);
  }
}
function syncFlash(){
  const k=state.cur,w=$('#flashwin'),has=CAMS[k].ctl.includes('flash');
  w.className='flashwin'+(has?(opts[k].flash?' on':''):' off');
}
function renderCounter(){
  const k=state.cur,c=CAMS[k];
  if(k==='camcorder'){
    const s=Math.floor((Date.now()-state.session)/1000);
    $('#counter').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;$('#counterLbl').textContent='REC';
  }else{$('#counter').textContent=roll[k];$('#counterLbl').textContent=c.rollLbl}
}
function selectCam(k,animate){
  state.cur=k;ls.set('argentique.cam',k);
  const c=CAMS[k],cam=$('#cam');
  cam.dataset.cam=k;
  $('#brand').textContent=c.brand;$('#spec').textContent=c.spec;
  document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k?'true':'false'));
  $('#app').style.setProperty('--cam-accent',c.accent);
  const pw=480;view.width=pw;view.height=Math.round(pw/c.ar);
  state.previewSeed=1+((Math.random()*1e6)|0);
  renderChips();syncFlash();renderCounter();
  if(animate){cam.classList.remove('swap');void cam.offsetWidth;cam.classList.add('swap')}
  const t=document.querySelector('.tile[aria-selected="true"]');
  if(t&&t.scrollIntoView)safe(()=>t.scrollIntoView({block:'nearest',inline:'center',behavior:animate?'smooth':'auto'}));
}
function updateLive(){
  $('#vftag').classList.toggle('live',state.live);
  $('#vftxt').textContent=state.live?'Direct':'Scène d’exemple';
  $('#note').textContent=state.live?'':'La caméra en direct n’est pas accessible dans cette page. Le déclencheur ouvre l’appareil photo de ton téléphone (ou un fichier sur ordinateur) et applique l’appareil choisi.';
  $('#note').hidden=state.live;
  renderChips();
}

/* ---------- Caméra ---------- */
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}state.live=false}
async function startCam(){
  stopCam();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    vid.srcObject=stream;await vid.play();state.live=true;
  }catch(e){stream=null;state.live=false}
  updateLive();
}

/* ---------- Aperçu ---------- */
let lastT=0;
function tick(t){
  requestAnimationFrame(tick);
  if(document.hidden||state.view!=='cam'||state.sheet||t-lastT<100)return;
  lastT=t;
  const k=state.cur;let src,sw,sh;
  if(state.live&&vid.videoWidth){src=vid;sw=vid.videoWidth;sh=vid.videoHeight}
  else{drawDemo(t);src=demo;sw=demo.width;sh=demo.height}
  develop(view,src,sw,sh,k,opts[k],{seed:state.previewSeed,grainSeed:(t|0)+1,date:new Date(),t,preview:true});
  if(k==='camcorder')renderCounter();
}

/* ---------- Prise de vue ---------- */
let ac=null;
function sound(kind){
  if(!state.sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const now=ac.currentTime;
    const click=(at,f)=>{
      const n=Math.floor(ac.sampleRate*.05),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
      const s=ac.createBufferSource();s.buffer=buf;
      const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
      const g=ac.createGain();g.gain.value=.9;s.connect(bp).connect(g).connect(ac.destination);s.start(now+at);
    };
    const tone=(at,f1,f2,dur,type,vol)=>{
      const o=ac.createOscillator(),g=ac.createGain();o.type=type;
      o.frequency.setValueAtTime(f1,now+at);o.frequency.linearRampToValueAtTime(f2,now+at+dur);
      g.gain.setValueAtTime(vol,now+at);g.gain.exponentialRampToValueAtTime(.001,now+at+dur);
      o.connect(g).connect(ac.destination);o.start(now+at);o.stop(now+at+dur+.02);
    };
    if(kind==='click'){click(0,2200);click(.09,1400)}
    else if(kind==='motor'){click(0,1800);click(.07,1100);tone(.18,190,80,.7,'sawtooth',.05)}
    else if(kind==='beep'){tone(0,1250,1250,.12,'square',.07);click(.02,2000)}
    else{tone(0,2400,2400,.07,'square',.05);tone(.09,3000,3000,.07,'square',.05);click(.03,1800)}
  }catch(e){}
}
function flashFx(){const f=$('#fx');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
async function capture(src,sw,sh){
  const k=state.cur,c=CAMS[k],W=c.outW,H=Math.round(W/c.ar);
  const cv=tmpC();cv.width=W;cv.height=H;
  const seed=1+((Math.random()*2e9)|0);
  develop(cv,src,sw,sh,k,opts[k],{seed,grainSeed:seed^0x9e3779b9,date:new Date(),t:0,preview:false});
  let final=cv,win=null;
  if(c.look.jpeg)await jpegRound(cv,c.look.jpeg);
  if(k==='instant'){const f=frameInstant(cv);final=f.canvas;win=f.win}
  const blob=await toBlob(final,k==='digicam'?.7:.92);
  return{blob,url:URL.createObjectURL(blob),w:final.width,h:final.height,cam:k,camName:c.name,t:Date.now(),win};
}
function useRoll(){
  const k=state.cur;
  if(CAMS[k].roll){roll[k]=Math.max(0,roll[k]-1);ls.set('argentique.roll.'+k,roll[k]);renderCounter();if(roll[k]===0)renderChips()}
}
async function shoot(){
  if(state.busy||state.sheet)return;
  const k=state.cur;
  if(CAMS[k].roll&&roll[k]<=0){toast('Pellicule terminée. Touche « Nouvelle pellicule ».');return}
  if(!(state.live&&vid.videoWidth)){$('#fileCam').click();return}
  state.busy=true;
  sound(CAMS[k].snd);flashFx();safe(()=>navigator.vibrate&&navigator.vibrate(12));
  await new Promise(r=>setTimeout(r,40));
  try{
    const ph=await capture(vid,vid.videoWidth,vid.videoHeight);
    useRoll();openSheet(ph,'new');
  }catch(e){toast('La photo a échoué, réessaie.')}
  state.busy=false;
}
function handleFile(file){
  if(!file)return;
  const k=state.cur;
  if(CAMS[k].roll&&roll[k]<=0){toast('Pellicule terminée. Touche « Nouvelle pellicule ».');return}
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=async()=>{
    state.busy=true;sound(CAMS[k].snd);flashFx();
    await new Promise(r=>setTimeout(r,40));
    try{const ph=await capture(im,im.naturalWidth,im.naturalHeight);useRoll();openSheet(ph,'new')}
    catch(e){toast('Cette image n’a pas pu être traitée.')}
    URL.revokeObjectURL(u);state.busy=false;
  };
  im.onerror=()=>{URL.revokeObjectURL(u);toast('Image illisible.')};
  im.src=u;
}

/* ---------- Galerie (IndexedDB avec repli mémoire) ---------- */
const Gal={db:null,mem:[],
  open(){return new Promise(res=>{
    try{
      const rq=indexedDB.open('argentique',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('p',{keyPath:'id'});
      rq.onsuccess=()=>{Gal.db=rq.result;res()};
      rq.onerror=()=>res();
    }catch(e){res()}
  })},
  add(rec){return new Promise(res=>{
    if(!Gal.db){Gal.mem.push(rec);return res()}
    try{const tx=Gal.db.transaction('p','readwrite');tx.objectStore('p').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>{Gal.mem.push(rec);res()}}
    catch(e){Gal.mem.push(rec);res()}
  })},
  all(){return new Promise(res=>{
    if(!Gal.db)return res(Gal.mem.slice().sort((a,b)=>b.t-a.t));
    try{const rq=Gal.db.transaction('p').objectStore('p').getAll();
      rq.onsuccess=()=>res(rq.result.concat(Gal.mem).sort((a,b)=>b.t-a.t));rq.onerror=()=>res(Gal.mem.slice())}
    catch(e){res(Gal.mem.slice())}
  })},
  del(id){return new Promise(res=>{
    Gal.mem=Gal.mem.filter(r=>r.id!==id);
    if(!Gal.db)return res();
    try{const tx=Gal.db.transaction('p','readwrite');tx.objectStore('p').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}
  })}
};
let thumbUrls=[];
async function renderGallery(){
  const items=await Gal.all();
  $('#galCount').textContent=items.length;
  thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls=[];
  const grid=$('#grid');grid.innerHTML='';
  $('#empty').hidden=items.length>0;grid.hidden=items.length===0;
  items.forEach(rec=>{
    const u=URL.createObjectURL(rec.blob);thumbUrls.push(u);
    const d=new Date(rec.t),b=document.createElement('button');
    b.className='thumb';b.setAttribute('aria-label',`Ouvrir la photo ${rec.camName} du ${d.toLocaleDateString('fr-FR')}`);
    b.innerHTML=`<img alt="" src="${u}"><span class="cap"><span>${rec.camName}</span><span>${pad(d.getDate())}/${pad(d.getMonth()+1)}</span></span>`;
    b.addEventListener('click',()=>openSheet(Object.assign({},rec,{url:URL.createObjectURL(rec.blob)}),'gallery'));
    grid.appendChild(b);
  });
}
async function refreshCount(){const n=(await Gal.all()).length;$('#galCount').textContent=n}

/* ---------- Téléchargement ---------- */
async function download(ph){
  const d=new Date(ph.t),name=`argentique-${ph.cam}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:ph.blob});toast('Photo enregistrée');return}
  }catch(e){if(e&&e.code==='declined')return}
  try{
    const a=document.createElement('a');a.href=ph.url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    toast('Téléchargement lancé');
  }catch(e){toast('Téléchargement impossible ici')}
}

/* ---------- Fenêtre résultat ---------- */
function openSheet(ph,mode){
  state.sheet=true;
  const sh=$('#sheet'),d=new Date(ph.t);
  const isNew=mode==='new';
  sh.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Photo">
    <div class="photo" id="ph"><img alt="Photo ${ph.camName}" src="${ph.url}">${ph.win&&isNew?`<div class="devmask" id="dm" style="left:${ph.win.l*100}%;top:${ph.win.t*100}%;width:${ph.win.w*100}%;height:${ph.win.h*100}%"></div>`:''}</div>
    <div class="meta"><span>${ph.camName}</span><span id="st">${ph.win&&isNew?'Développement en cours…':d.toLocaleString('fr-FR',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
    <div class="actions">${isNew
      ?`<button class="btn danger" id="bDrop">Jeter</button><button class="btn" id="bDl">Télécharger</button><button class="btn primary" id="bKeep">Garder dans la galerie</button>`
      :`<button class="btn danger" id="bDel">Supprimer</button><button class="btn" id="bDl">Télécharger</button><button class="btn primary" id="bClose">Fermer</button>`}</div>
  </div>`;
  sh.hidden=false;
  const close=()=>{sh.hidden=true;sh.innerHTML='';state.sheet=false;URL.revokeObjectURL(ph.url);document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',esc);
  sh.onclick=e=>{if(e.target===sh)close()};
  const dm=sh.querySelector('#dm');
  if(dm)dm.addEventListener('animationend',()=>{const s=sh.querySelector('#st');if(s)s.textContent='Photo développée';dm.remove()});
  sh.querySelector('#bDl').onclick=()=>download(ph);
  if(isNew){
    sh.querySelector('#bDrop').onclick=close;
    const keep=sh.querySelector('#bKeep');
    keep.onclick=async()=>{
      keep.disabled=true;
      await Gal.add({id:ph.t+'-'+((Math.random()*1e6)|0),cam:ph.cam,camName:ph.camName,t:ph.t,blob:ph.blob,w:ph.w,h:ph.h});
      keep.textContent='Gardée dans la galerie';refreshCount();toast('Ajoutée à la galerie');
    };
  }else{
    sh.querySelector('#bClose').onclick=close;
    const del=sh.querySelector('#bDel');let armed=false;
    del.onclick=async()=>{
      if(!armed){armed=true;del.textContent='Confirmer la suppression';setTimeout(()=>{if(del.isConnected){armed=false;del.textContent='Supprimer'}},3500);return}
      await Gal.del(ph.id);close();renderGallery();toast('Photo supprimée');
    };
  }
}

/* ---------- Navigation ---------- */
function setView(v){
  state.view=v;
  $('#viewCam').hidden=v!=='cam';$('#viewGal').hidden=v!=='gal';
  $('#tabCam').setAttribute('aria-selected',v==='cam'?'true':'false');
  $('#tabGal').setAttribute('aria-selected',v==='gal'?'true':'false');
  if(v==='gal')renderGallery();
}

/* ---------- Démarrage ---------- */
$('#tabCam').onclick=()=>setView('cam');
$('#tabGal').onclick=()=>setView('gal');
$('#goCam').onclick=()=>setView('cam');
$('#shutter').onclick=shoot;
$('#fileCam').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};
$('#fileLib').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};
$('#soundBtn').onclick=()=>{state.sound=!state.sound;$('#soundBtn').setAttribute('aria-pressed',state.sound?'true':'false');ls.set('argentique.sound',state.sound?'1':'0')};
$('#soundBtn').setAttribute('aria-pressed',state.sound?'true':'false');
setInterval(()=>{if(state.cur==='camcorder')renderCounter()},1000);

buildPicker();
selectCam(state.cur,false);
updateLive();
if(document.fonts&&document.fonts.load)safe(()=>document.fonts.load('24px VT323'));
Gal.open().then(refreshCount);
startCam();
requestAnimationFrame(tick);
})();
</script>
